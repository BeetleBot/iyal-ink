<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ActOne Documentation | iyal.ink</title>
  <link rel="stylesheet" href="../../assets/site.css">
  <style>
    :root {
      --docs-sidebar-w: 280px;
      --docs-toc-w: 220px;
    }
    body.actone-theme {
      background: var(--paper);
    }
    .docs-layout {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: var(--docs-sidebar-w) minmax(0, 1fr) var(--docs-toc-w);
      min-height: calc(100vh - 64px);
    }
    
    /* Left Sidebar */
    .docs-sidebar {
      position: sticky;
      top: 0;
      height: calc(100vh - 64px);
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #e9e6de;
      padding: 24px 16px;
    }
    .docs-search-box {
      margin-bottom: 20px;
    }
    .docs-search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--ink);
      background: var(--paper);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }
    .docs-search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(40, 88, 214, 0.2);
    }
    .nav-group-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 20px 0 8px 10px;
    }
    .nav-group-title:first-child {
      margin-top: 0;
    }
    .nav-item {
      display: block;
      padding: 7px 12px;
      font-size: 0.85rem;
      color: var(--ink);
      border-radius: 4px;
      margin-bottom: 2px;
      cursor: pointer;
      line-height: 1.3;
    }
    .nav-item:hover {
      background: rgba(0, 0, 0, 0.05);
      color: var(--blue);
    }
    .nav-item.active {
      font-weight: 700;
      background: var(--ink);
      color: var(--paper);
    }

    /* Main Content Area */
    .docs-main {
      padding: 40px 60px;
      max-width: 860px;
    }
    .docs-breadcrumb {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .docs-article-title {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }
    .docs-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 36px;
    }
    .tag-badge {
      font-size: 0.7rem;
      font-weight: 700;
      font-family: CourierPrime, monospace;
      background: #dfdcd4;
      border: 1px solid var(--line);
      padding: 3px 8px;
    }
    .docs-content {
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--ink);
    }
    .docs-content h2 {
      font-size: 1.7rem;
      margin-top: 48px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .docs-content h3 {
      font-size: 1.25rem;
      margin-top: 32px;
      margin-bottom: 12px;
    }
    .docs-content p {
      margin-bottom: 20px;
    }
    .docs-content ul, .docs-content ol {
      margin-bottom: 24px;
      padding-left: 24px;
    }
    .docs-content li {
      margin-bottom: 8px;
    }
    .docs-content code {
      font-family: CourierPrime, monospace;
      background: #e3e0d6;
      padding: 3px 6px;
      font-size: 0.9em;
      border-radius: 3px;
    }
    .docs-content kbd {
      font-family: CourierPrime, monospace;
      background: var(--ink);
      color: var(--paper);
      padding: 3px 7px;
      font-size: 0.78rem;
      border-radius: 3px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .docs-content pre {
      background: #181817;
      color: #e7e4dc;
      padding: 20px;
      overflow-x: auto;
      font-family: CourierPrime, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
      border-left: 4px solid var(--blue);
    }
    .docs-table {
      width: 100%;
      border-collapse: collapse;
      margin: 28px 0;
      font-size: 0.9rem;
    }
    .docs-table th, .docs-table td {
      border: 1px solid var(--line);
      padding: 10px 14px;
      text-align: left;
    }
    .docs-table th {
      background: #dedbd2;
      font-weight: 700;
    }

    /* Article Footer Navigation (Prev / Next) */
    .docs-article-footer {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    .nav-card {
      border: 1px solid var(--ink);
      padding: 16px 20px;
      flex: 1;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .nav-card:hover {
      background: #dedbd2;
      transform: translateY(-2px);
    }
    .nav-card-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .nav-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }
    .nav-card.next { text-align: right; }

    /* Right Table of Contents (TOC) */
    .docs-toc {
      position: sticky;
      top: 0;
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 32px 20px;
      border-left: 1px solid var(--line);
      font-size: 0.8rem;
    }
    .toc-title {
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .toc-item {
      margin-bottom: 8px;
    }
    .toc-item a {
      color: var(--muted);
      line-height: 1.3;
      display: block;
    }
    .toc-item a:hover {
      color: var(--blue);
    }

    @media(max-width:1100px){
      .docs-layout { grid-template-columns: var(--docs-sidebar-w) minmax(0, 1fr); }
      .docs-toc { display: none; }
    }
    @media(max-width:760px){
      .docs-layout { grid-template-columns: 1fr; }
      .docs-sidebar { position: relative; height: auto; max-height: 380px; }
      .docs-main { padding: 30px 20px; }
    }
  </style>
</head>
<body class="product-page actone-theme">
  <header class="site-header">
    <a class="iyal-mark" href="../../"><img class="iyal-mark-img" src="../../assets/IyalLogo.svg" alt="iyal.ink"></a>
    <nav class="site-nav">
      <a href="../">ActOne Workspace</a>
      <a href="../../support/">Support</a>
      <a href="../../blog/">Blog</a>
    </nav>
  </header>

  <div class="docs-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="docs-sidebar">
      <div class="docs-search-box">
        <input type="text" id="searchInput" class="docs-search-input" placeholder="Search documentation…">
      </div>
      <nav id="docsNav"></nav>
    </aside>

    <!-- Main Content Area -->
    <main class="docs-main">
      <div class="docs-breadcrumb" id="articleCategory"></div>
      <h1 class="docs-article-title" id="articleTitle">Loading documentation…</h1>
      <div class="docs-tags" id="articleTags"></div>
      <article class="docs-content" id="articleBody"></article>

      <div class="docs-article-footer">
        <div class="nav-card prev" id="prevCard" style="display:none;" onclick="navigatePrev()">
          <div class="nav-card-label">← Previous</div>
          <div class="nav-card-title" id="prevTitle"></div>
        </div>
        <div class="nav-card next" id="nextCard" style="display:none;" onclick="navigateNext()">
          <div class="nav-card-label">Next →</div>
          <div class="nav-card-title" id="nextTitle"></div>
        </div>
      </div>
    </main>

    <!-- Right Table of Contents Sidebar -->
    <aside class="docs-toc">
      <div class="toc-title">On this page</div>
      <ul class="toc-list" id="tocList"></ul>
    </aside>
  </div>

  <footer class="site-footer">
    <span>iyal.ink / ActOne Documentation</span>
    <a href="../">Back to ActOne Workspace</a>
  </footer>

  <script src="articles_data.js"></script>
  <script>
    let docsData = { categories: [], articles: [] };
    let activeArticleId = '';
    let filteredArticles = [];

    async function loadDocs() {
      try {
        if (typeof DOCS_DATA !== 'undefined') {
          docsData = DOCS_DATA;
        } else {
          const res = await fetch('articles_data.json');
          docsData = await res.json();
        }
        
        // Initial setup
        const hash = window.location.hash.replace('#', '');
        activeArticleId = (hash && docsData.articles.some(a => a.id === hash)) ? hash : docsData.articles[0].id;
        
        renderNav();
        renderArticle(activeArticleId);

        document.getElementById('searchInput').addEventListener('input', (e) => {
          renderNav(e.target.value);
        });

        window.addEventListener('hashchange', () => {
          const newHash = window.location.hash.replace('#', '');
          if (newHash && docsData.articles.some(a => a.id === newHash)) {
            renderArticle(newHash);
          }
        });
      } catch (e) {
        console.error('Failed to load docs data:', e);
        document.getElementById('articleTitle').innerText = 'Error loading documentation.';
      }
    }

    function renderNav(searchQuery = '') {
      const navEl = document.getElementById('docsNav');
      const query = searchQuery.toLowerCase().trim();
      let html = '';

      docsData.categories.forEach(cat => {
        let catArticles = docsData.articles.filter(a => a.category === cat);
        if (query) {
          catArticles = catArticles.filter(a => 
            a.title.toLowerCase().includes(query) || 
            a.content.toLowerCase().includes(query) ||
            a.tags.some(t => t.toLowerCase().includes(query))
          );
        }

        if (catArticles.length > 0) {
          html += `<div class="nav-group-title">${cat}</div>`;
          catArticles.forEach(art => {
            const isActive = art.id === activeArticleId;
            html += `<a class="nav-item ${isActive ? 'active' : ''}" onclick="selectArticle('${art.id}')">${art.title}</a>`;
          });
        }
      });

      if (!html) {
        html = '<div style="font-size:0.85rem; color:var(--muted); padding:10px;">No matching articles.</div>';
      }

      navEl.innerHTML = html;
    }

    function selectArticle(id) {
      window.location.hash = id;
      renderArticle(id);
    }

    function renderArticle(id) {
      activeArticleId = id;
      const index = docsData.articles.findIndex(a => a.id === id);
      const article = docsData.articles[index] || docsData.articles[0];

      document.getElementById('articleCategory').innerText = article.category;
      document.getElementById('articleTitle').innerText = article.title;
      document.getElementById('articleTags').innerHTML = article.tags.map(t => `<span class="tag-badge">#${t}</span>`).join('');
      
      const bodyEl = document.getElementById('articleBody');
      bodyEl.innerHTML = parseMarkdown(article.content);

      // Render TOC for H2 headings
      renderTOC();

      // Render Prev / Next cards
      renderFooterNav(index);

      // Update Nav active highlight
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.innerText.trim() === article.title) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTOC() {
      const tocEl = document.getElementById('tocList');
      const headings = document.querySelectorAll('.docs-content h2');
      let html = '';

      headings.forEach((h, i) => {
        const id = 'heading-' + i;
        h.id = id;
        html += `<li class="toc-item"><a href="#${id}" onclick="event.preventDefault(); document.getElementById('${id}').scrollIntoView({behavior:'smooth'});">${h.innerText}</a></li>`;
      });

      if (headings.length === 0) {
        html = '<li class="toc-item" style="color:var(--muted)">Overview</li>';
      }

      tocEl.innerHTML = html;
    }

    function renderFooterNav(currentIndex) {
      const prevCard = document.getElementById('prevCard');
      const nextCard = document.getElementById('nextCard');

      if (currentIndex > 0) {
        const prevArticle = docsData.articles[currentIndex - 1];
        document.getElementById('prevTitle').innerText = prevArticle.title;
        prevCard.style.display = 'block';
      } else {
        prevCard.style.display = 'none';
      }

      if (currentIndex < docsData.articles.length - 1) {
        const nextArticle = docsData.articles[currentIndex + 1];
        document.getElementById('nextTitle').innerText = nextArticle.title;
        nextCard.style.display = 'block';
      } else {
        nextCard.style.display = 'none';
      }
    }

    function navigatePrev() {
      const index = docsData.articles.findIndex(a => a.id === activeArticleId);
      if (index > 0) {
        selectArticle(docsData.articles[index - 1].id);
      }
    }

    function navigateNext() {
      const index = docsData.articles.findIndex(a => a.id === activeArticleId);
      if (index < docsData.articles.length - 1) {
        selectArticle(docsData.articles[index + 1].id);
      }
    }

    function parseMarkdown(md) {
      let html = md;
      
      // Code blocks
      html = html.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
      
      // Headings
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      
      // Formatting
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/<kbd>(.*?)<\/kbd>/g, '<kbd>$1</kbd>');
      
      // Tables
      const lines = html.split('\n');
      let inTable = false;
      let tableHtml = '';
      let newLines = [];
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
          if (!inTable) {
            inTable = true;
            tableHtml = '<table class="docs-table"><thead>';
            let headers = line.split('|').slice(1, -1).map(h => h.trim());
            tableHtml += '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
          } else if (line.includes('---')) {
            continue;
          } else {
            let cells = line.split('|').slice(1, -1).map(c => c.trim());
            tableHtml += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
          }
        } else {
          if (inTable) {
            inTable = false;
            tableHtml += '</tbody></table>';
            newLines.push(tableHtml);
            tableHtml = '';
          }
          newLines.push(line);
        }
      }
      if (inTable) {
        tableHtml += '</tbody></table>';
        newLines.push(tableHtml);
      }
      
      html = newLines.join('\n');
      html = html.replace(/^\- (.*$)/gim, '<li>$1</li>');

      let paragraphs = html.split(/\n\n+/);
      return paragraphs.map(p => {
        p = p.trim();
        if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<table') || p.startsWith('<ul') || p.startsWith('<li')) {
          return p;
        }
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
    }

    loadDocs();
  </script>
</body>
</html>
