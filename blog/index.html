<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — iyal.inc</title>
  <link rel="icon" type="image/svg+xml" href="../assets/@iyal.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --border: #1e1e2e;
      --text: #e2e2ee;
      --text-dim: #6c6c8a;
      --accent: #cba6f7;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text);
    }

    .brand-logo {
      height: 36px;
      width: auto;
    }

    nav a {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }

    nav a:hover { border-color: var(--accent); background: var(--surface-hover); }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 48px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-dim);
      font-size: 0.9rem;
      max-width: 360px;
      margin-inline: auto;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a href="../" class="brand">
      <svg viewBox="0 0 12500 12500" class="brand-logo" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2175.732,3124.216c-0,-276.142 223.858,-500 500,-500c309.022,-0 704.204,-0 1013.226,-0c276.142,0 500,223.858 500,500c-0,440.412 -0,1078.561 -0,1518.973c0,276.142 -223.858,500 -500,500c-309.022,0 -704.204,0 -1013.226,0c-276.142,-0 -500,-223.858 -500,-500c0,-440.412 0,-1078.561 0,-1518.973Zm0,3011.556c-0,-276.142 223.858,-500 500,-500c309.022,-0 704.204,-0 1013.226,-0c276.142,0 500,223.858 500,500c-0,815.875 -0,2424.137 -0,3240.012c0,276.142 -223.858,500 -500,500c-309.022,0 -704.204,0 -1013.226,0c-276.142,-0 -500,-223.858 -500,-500c0,-815.875 0,-2424.137 0,-3240.012Z"/><path d="M8311.042,3124.216c-0,-276.142 223.858,-500 500,-500c309.022,-0 704.204,-0 1013.226,-0c276.142,0 500,223.858 500,500c-0,440.412 -0,1078.561 -0,1518.973c0,276.142 -223.858,500 -500,500l-1013.226,0c-276.142,-0 -500,-223.858 -500,-500c0,-440.412 0,-1078.561 0,-1518.973Zm0,3011.556c-0,-276.142 223.858,-500 500,-500c309.022,-0 704.204,-0 1013.226,-0c276.142,0 500,223.858 500,500c-0,815.875 -0,2424.137 -0,3240.012c0,276.142 -223.858,500 -500,500c-309.022,0 -704.204,0 -1013.226,0c-276.142,-0 -500,-223.858 -500,-500c0,-815.875 0,-2424.137 0,-3240.012Z"/><path d="M5174.136,5740.914c0,-276.142 223.858,-500 500,-500c346.291,-0 805.437,-0 1151.728,-0c276.142,0 500,223.858 500,500l0,1018.172c-0,276.142 -223.858,500 -500,500c-346.291,0 -805.437,0 -1151.728,0c-276.142,-0 -500,-223.858 -500,-500c0,-310.371 0,-707.801 0,-1018.172Z"/></svg>
    </a>
    <nav>
      <a href="../">Home</a>
    </nav>
  </header>

  <main>
    <h1>Blog</h1>
    <p class="subtitle">Thoughts on screenwriting, tools, and craft.</p>

    <div class="empty-state">
      <div class="empty-state-icon">✎</div>
      <h2>Coming soon</h2>
      <p>Stories about building FountTUI, ActOne, and the art of writing for the screen.</p>
    </div>
  </main>

  <footer>
    <p>© iyal.inc</p>
  </footer>
</body>
</html>
